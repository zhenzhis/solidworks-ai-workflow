[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "solidworks-ai-workflow"
version = "0.3.0"
description = "Guarded, reproducible SolidWorks jobs for noncommercial use"
readme = "README.md"
requires-python = ">=3.11"
license = "PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "src/sw_workflow/_vendor/LICENSE"]
authors = [{name = "zhenzhis"}]
dependencies = []

[project.optional-dependencies]
cad = ["pywin32>=312; sys_platform == 'win32'", "comtypes>=1.4.17; sys_platform == 'win32'"]
mcp = ["mcp==2.2.0", "jsonschema>=4.26,<5"]
test = ["pytest>=8,<10", "build>=1.2,<2", "skills-ref==0.1.1"]

[project.scripts]
sw-workflow = "sw_workflow.cli:main"
sw-workflow-mcp = "sw_workflow.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
